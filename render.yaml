# ============================================================
# منصة أم سارة — Render Blueprint (نشر تلقائي كامل من المستودع)
#
# الطريقة (مرة واحدة): Render → New → Blueprint → اختر AhmedMar98/Umm-sara
#   → املأ المتغيرات السرية (sync: false) → Deploy
# بعدها: كل push إلى main ينشر تلقائياً (autoDeploy: true)
#
# لماذا Docker runtime؟ (مثبت بالقياس — worklog Task 18)
#   البناء يستهلك ~1.8GB ذاكرة ذروة (npm ci 1842MB · build 1680MB)
#   والخطة المجانية تقدم 512MB على runtime الأصلي → OOM حتمي.
#   Docker يُبنى على بنّاة منفصلين بذاكرة أكبر، والتشغيل
#   (خادم standalone) قِيست ذروته ~100MB فقط.
# ============================================================

services:
  # ---------- الواجهة (Next.js عبر Docker) ----------
  - type: web
    name: umm-sarah-web
    runtime: docker
    plan: free # تنام بعد 15 دقيقة خمول وتصحو عند الزيارة
    region: frankfurt # الأقرب للسعودية ضمن مناطق Render
    branch: main
    autoDeploy: true # كل push إلى main = نشر تلقائي
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20" # node:20-alpine في Dockerfile هو المرجع الفعلي
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false # من Supabase → Project Settings → API → Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # سري — من Supabase → Project Settings → API → service_role
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # احتياط الكود (نفس Project URL)
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false # مثال: 966501234567 — يُدمج وقت البناء؛ اضبطه قبل أول نشر

