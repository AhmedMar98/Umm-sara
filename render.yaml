# ============================================================
# منصة أم سارة — Render (نشر تلقائي كامل من المستودع)
#
# الحالة الفعلية (2026-09-20، worklog Task 19): الخدمة umm-sarah-web
# منشورة ومتصلة بالمستودع عبر API على خطة free بمنطقة oregon —
# هذا الملف وثيقة مرجعية للمواصفات (وخدمة بدء نظيف عبر Blueprint).
# بعدها: كل push إلى main ينشر تلقائياً (autoDeploy: true).
#
# Node runtime — مثبت بسجلات Render نفسها (Task 19):
#   npm ci = 843 حزمة في 29 ثانية · next build = 18/18 صفحة في ~60 ثانية
#   («✓ Ready in 612ms») — البناء يعمل على الخطة المجانية بلا أي OOM.
#   فشل نشر 10:17 سببه الوحيد: healthCheckPath ظل /healthz (قيمة الخدمة
#   القديمة المعاد توظيفها) والمسار لم يكن في التطبيق — عولج بضبطه
#   في المستوى الصحيح (serviceDetails) + إضافة مسار /healthz في التطبيق.
# ============================================================

services:
  # ---------- الواجهة (Next.js) — الخدمة الوحيدة المفعلة ----------
  - type: web
    name: umm-sarah-web
    runtime: node
    plan: free # تنام بعد 15 دقيقة خمول وتصحو عند أول زيارة (إقلاع ~30-60 ث)
    region: oregon # منطقة الخدمة الفعلية (تثبت عند الإنشاء)
    branch: main
    autoDeploy: true # كل push إلى main = نشر تلقائي
    # --legacy-peer-deps مطلوب: يثبّت الشجرة المقفلة حرفياً — التوثيق الكامل
    # لسبب التعارض (@lexical/yjs peer على yjs) في DEPLOYMENT.md
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    # / و /healthz كلاهما يعيد 200 من التطبيق — الفحصان صالحان
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false # من Supabase → Project Settings → API → Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # سري — من Supabase → Project Settings → API → service_role
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # احتياط الكود (نفس Project URL)
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false # مثال: 966501234567 — يُدمج وقت البناء؛ اضبطه قبل أول نشر

