# ============================================================
# منصة أم سارة — Render Blueprint (نشر تلقائي كامل من المستودع)
#
# الطريقة (مرة واحدة): Render → New → Blueprint → اختر AhmedMar98/Umm-sara
#   → املأ المتغيرات السرية (sync: false) → Deploy
# بعدها: كل push إلى main ينشر تلقائياً (autoDeploy: true)
#
# مُثبت بالمحاكاة الكاملة (2026-09-20، worklog Task 17):
#   تثبيت نظيف NODE_ENV=production (devDeps مُقصاة، prisma/sharp سكربتات ناجحة)
#   → بناء 22.4s (18/18 صفحة، فحص TS مفعّل)
#   → خادم standalone يستجيب 200 + مسارات API تعمل بالتدهور الرشيق
# ============================================================

services:
  # ---------- الواجهة (Next.js) — الخدمة المفعّلة الوحيدة ----------
  - type: web
    name: umm-sarah-web
    runtime: node
    plan: starter
    region: frankfurt # الأقرب للسعودية ضمن مناطق Render
    branch: main
    autoDeploy: true # كل push إلى main = نشر تلقائي
    # --legacy-peer-deps مطلوب: @lexical/yjs (من @mdxeditor) يصرح بـ peer على yjs
    # لا يستخدمه التطبيق، وسلسلة peerOptional الخاصة بـ @react-three/fiber تجبر
    # npm على بناء شجرة مثالية متضاربة. العلم يثبّت الشجرة المقفلة الحرفية.
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false # من Supabase → Project Settings → API → Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # سري — من Supabase → Project Settings → API → service_role
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # احتياط الكود إن غاب SUPABASE_URL (نفس Project URL)
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false # مثال: 966501234567 — يُدمج وقت البناء؛ اضبطه قبل أول نشر

